<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yacar's | P&aacute;gina oficial</title>

  <script>
    (function(){
      try {
        if (localStorage.getItem("yacar-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/index.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<main class="app">
  <header class="header">
    <div class="logo">
      <img src="images/logo.png" alt="Yacar's Lavadero">
    </div>

    <p>Agenda tu lavado</p>
  </header>

  <button id="themeToggle" class="theme-toggle public-theme-toggle" type="button" aria-label="Cambiar a modo noche"></button>

  <section class="card">
    <div class="mode-toggle">
      <span>Lavado</span>
      <label class="switch">
        <input type="checkbox" id="modoRecogida">
        <span class="slider"></span>
      </label>
      <span>Recogida</span>
    </div>

    <div id="form-normal">
      <label>Placa de la moto</label>
      <input type="text" id="placa" placeholder="ABC123">

      <label>Servicio</label>
      <select id="servicio">
        <option value="">Cargando servicios...</option>
      </select>
    </div>

    <div id="form-recogida" class="hidden">
      <label>Nombre</label>
      <input type="text" id="nombre">

      <label>Tel&eacute;fono</label>
      <input type="tel" id="telefono">

      <label>Placa</label>
      <input type="text" id="placaRecogida">

      <label>Fecha</label>
      <input type="date" id="fecha">

      <label>Hora</label>
      <input type="time" id="hora">
    </div>

    <button id="agendar">Agendar</button>
  </section>
</main>

<footer class="footer">
  <span>&copy; <span id="year"></span> Yacar's Lavadero</span>
</footer>

<script src="js/config.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>

</body>
</html>
